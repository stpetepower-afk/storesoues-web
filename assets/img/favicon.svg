<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hallelujah One">
  <defs>
    <linearGradient id="hg" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="0.5" stop-color="#b58bff"/>
      <stop offset="1" stop-color="#e8c46a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b1020"/>
  <!-- halo -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#hg)" stroke-width="2.4" opacity="0.55"/>
  <!-- ascending unity mark: an upward figure forming the '1' of ONE -->
  <path d="M32 15 L32 49" stroke="url(#hg)" stroke-width="6" stroke-linecap="round"/>
  <path d="M23 24 L32 15 L41 24" fill="none" stroke="url(#hg)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="49" r="3.6" fill="#e8c46a"/>
</svg>
